name: 检查国漫追更
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guoman-site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: guoman-site/.nvmrc
          cache: npm
          cache-dependency-path: guoman-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run cloudbase:prepare
